# Analisi statica del motore (x32_core). Regole scelte per un codice di rete:
# abbonamenti e sink chiusi, Future non dimenticati, cast espliciti.
analyzer:
  language:
    strict-casts: true
  exclude:
    - lib/src/generated/**

linter:
  rules:
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - avoid_print
    - prefer_final_locals
    - always_declare_return_types
