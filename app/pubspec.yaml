name: x32_remote
description: Controller professionale per mixer Behringer X32 e Midas M32.
publish_to: none
version: 1.0.0+7

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # testi standard di Flutter (pulsanti, pagina delle licenze) nelle lingue supportate
  flutter_localizations:
    sdk: flutter
  x32_core:
    path: ../packages/x32_core

dev_dependencies:
  # simulatore usato solo dai test automatici (non fa parte del programma)
  x32_sim:
    path: ../packages/x32_sim
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
