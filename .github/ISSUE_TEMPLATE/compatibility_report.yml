name: Compatibility report
description: Tell us how Fadera works with your mixer model and firmware
labels: [compatibility]
body:
  - type: input
    id: mixer
    attributes:
      label: Mixer model and firmware
      placeholder: "Midas M32R, firmware 4.13"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fadera version
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What did you test?
      options:
        - label: Discovery and connection
        - label: Sync (names, colours, faders match the console)
        - label: Faders, mute, solo, pan from Fadera
        - label: Channel EQ / gate / compressor from Fadera
        - label: Meters and gain reduction
        - label: Effects, scenes or routing
  - type: textarea
    id: notes
    attributes:
      label: Results and problems
    validations:
      required: true
